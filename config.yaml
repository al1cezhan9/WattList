# Solar-Arbitrage EV Controller Configuration

# Environment Parameters
environment:
  # EV Battery Constraints
  ev_capacity_kwh: 75.0                 # EV battery capacity (kWh)
  charging_efficiency: 0.90             # Charging efficiency (η = 0.90)
  max_charging_power_kw: 7.4            # Maximum charging power (kW)
  
  # Solar Generation Parameters
  max_solar_output_kw: 10.0             # Maximum solar output (0-10 kW)
  solar_noise_std: 0.5                  # Standard deviation of Gaussian noise for solar
  
  # Time-of-Use Pricing (3-tier)
  tou_prices:
    peak: 0.30                          # Peak hours: 4 PM - 9 PM ($/kWh)
    mid: 0.20                           # Mid hours: 9 AM - 4 PM, 9 PM - 11 PM ($/kWh)
    off_peak: 0.10                      # Off-peak: 11 PM - 9 AM ($/kWh)
  
  # Episode Parameters
  max_hours: 24                         # Maximum hours per episode
  target_soc: 0.9                       # Target SoC at departure (0.9 = 90%)
  departure_penalty_scale: 100.0       # Penalty scale for low SoC at departure
  
  # Reward Weights
  solar_reward_weight: 1.5              # Weight for solar energy reward
  grid_cost_weight: 1.0                 # Weight for grid cost penalty

# Neural Network Architecture (for SB3 MlpPolicy)
network:
  input_dim: 4                          # Input dimension [solar_output, ev_soc, time_remaining, grid_price]
  hidden_dim: 128                       # Hidden layer size (used by SB3)
  output_dim: 2                         # Output dimension (2 discrete actions)

# PPO Algorithm Parameters (Stable Baselines 3)
ppo:
  learning_rate: 3e-4                   # Learning rate for optimizer
  n_steps: 2048                         # Number of steps per update
  batch_size: 64                        # Batch size for training
  n_epochs: 10                          # Number of epochs per update
  gamma: 0.99                           # Discount factor
  gae_lambda: 0.95                      # GAE lambda parameter
  clip_range: 0.2                       # PPO clipping range
  ent_coef: 0.01                        # Entropy coefficient
  vf_coef: 0.5                          # Value function coefficient

# Training Configuration
training:
  total_timesteps: 100000               # Total training timesteps
  model_save_path: "models/solar_agent"  # Path to save/load the trained model (SB3 format)
  onnx_export_path: "solar_agent.onnx"  # Path to save ONNX model for NPU deployment
  simulation_speed: 0.05                # Sleep time between steps (seconds) - for visualization only
  reward_history_length: 1000           # Maximum reward history to keep
  episode_history_length: 100           # Episodes for running average calculation

# Web Server Configuration  
server:
  host: "0.0.0.0"                       # Host address
  port: 8080                            # Port number
  debug: false                          # Flask debug mode

# Logging Configuration
logging:
  level: "INFO"                         # Logging level
  format: "%(asctime)s - %(message)s"   # Log message format
  episode_summary_frequency: 10         # Episodes between summary logs
  log_file: "training.log"              # Log file name (appends when resuming, overwrites when starting fresh)
